systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding\=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Reuse the configured task graph between builds (skips re-running build scripts).
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Preserve the existing Kotlin plugin and Android DSL with Backdrop's required AGP 9.
android.builtInKotlin=false
android.newDsl=false

# Release signing lives in local.properties (RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) or the environment. Use the key of the app
# Tuned replaces, so it installs as that app's update.

# Gradle needs JDK 21. On JDK 25, Robolectric 4.12 and mockk can't read the class files and
# unit tests fail. Android Studio uses its own JDK 21; from a terminal, set JAVA_HOME to one.
